deployAs:
  - name: assets
    applicationType: assets

  - name: processor
    applicationType: service
    endpoint: /
    scripts:
      postDeploy: npm install && npm run connector:post-deploy
      preUndeploy: npm install && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_PROJECT_KEY
          description: commercetools project key
          required: true
        - key: CTP_CLIENT_ID
          description: commercetools client ID with manage_payments, manage_orders, view_sessions, view_api_clients, manage_checkout_payment_intents, introspect_oauth_tokens, manage_types and view_types scopes, plus view_product_types if BILL_PAYMENT_EXCLUDED_PRODUCT_TYPES is set
          required: true
        - key: CTP_REGION
          description: commercetools region (example - europe-west1.gcp)
          default: europe-west1.gcp
          required: false
        - key: CTP_SCOPES
          description: commercetools scopes (example - view_api_clients manage_orders manage_payments view_types manage_types view_sessions introspect_oauth_tokens manage_checkout_payment_intents, add view_product_types if BILL_PAYMENT_EXCLUDED_PRODUCT_TYPES is set)
          required: true
        - key: CTP_AUTH_URL
          description: commercetools Auth URL
          default: https://auth.europe-west1.gcp.commercetools.com
          required: false
        - key: CTP_API_URL
          description: commercetools API URL
          default: https://api.europe-west1.gcp.commercetools.com
          required: false
        - key: CTP_SESSION_URL
          description: Session API URL
          required: true
          default: https://session.europe-west1.gcp.commercetools.com
        - key: CTP_JWKS_URL
          description: JWKs url (example - https://mc-api.europe-west1.gcp.commercetools.com/.well-known/jwks.json)
          default: https://mc-api.europe-west1.gcp.commercetools.com/.well-known/jwks.json
          required: false
        - key: CTP_JWT_ISSUER
          description: JWT Issuer for jwt validation (example - https://mc-api.europe-west1.gcp.commercetools.com)
          default: https://mc-api.europe-west1.gcp.commercetools.com
          required: false
        - key: DEBUG
          description: Debug mode (0 or 1)
          required: false
          default: "0"
        - key: WIDGET_ENABLED
          description: Toggle display the EasyCredit Widget (0 or 1)
          required: true
          default: "1"
        - key: BILL_PAYMENT_ENABLED
          description: Offer easyCredit pay by invoice as a separate payment method in the checkout (0 or 1). Transactions with paymentType BILL_PAYMENT are accepted if this is 1 and easyCredit has activated pay by invoice for the webshop.
          required: false
          default: "0"
        - key: BILL_PAYMENT_EXCLUDED_PRODUCT_TYPES
          description: Comma-separated product type keys (for example vouchers) that rule out pay by invoice if any line item of the cart has one of them. Each entry has at least 2 characters out of A-Z, a-z, 0-9, _ and -, an invalid entry stops the connector at startup. The keys are resolved in one query, so keep the list short; with more than 500 keys the lookup fails and pay by invoice is not offered. Requires the view_product_types scope.
          required: false
        - key: BILL_PAYMENT_EXCLUDED_CUSTOM_LINE_ITEMS
          description: Comma-separated custom line item slugs or keys that rule out pay by invoice if the cart contains one of them. Each entry has at least 2 characters out of A-Z, a-z, 0-9, _ and -, an invalid entry stops the connector at startup.
          required: false
        - key: WEBSHOP_CACHE_TTL
          description: Cache duration in seconds (0 to 3600) for the easyCredit webshop configuration (activation status and order value limits)
          required: false
          default: "300"
        - key: TRANSACTION_CUSTOM_TYPE_KEY
          description: Key of the custom type for transaction resources. Use an existing key to share a custom type with other connectors. The post-deploy script adds the field definitions easyCreditTechnicalTransactionId, easyCreditInterest and easyCreditTotalValue if they are missing, so an existing deployment gets the two interest fields by redeploying the connector. Until then writing them fails with a logged warning and an `Error in updatePayment` error log on every installment Get Payment or Authorize Payment call, and nothing else changes.
          required: false
          default: easy-credit-technical-transaction-id
        - key: PAYMENT_CUSTOM_TYPE_KEY
          description: Key of the custom type for payment resources. Use an existing key to share a custom type with other connectors.
          required: false
          default: easy-credit-payment
      securedConfiguration:
        - key: CTP_CLIENT_SECRET
          description: Commercetools Composable Commerce client secret
          required: true
        - key: WEBSHOP_ID
          description: EasyCredit WebShop ID
          required: true
        - key: API_PASSWORD
          description: EasyCredit API password
          required: true
