<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous" />
    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"></script>
    <script>
      var __VITE_CTP_AUTH_URL__ = !'%VITE_CTP_AUTH_URL%'.startsWith('%') && '%VITE_CTP_AUTH_URL%';
      var __VITE_CTP_API_URL__ = !'%VITE_CTP_API_URL%'.startsWith('%') && '%VITE_CTP_API_URL%';
      var __VITE_CTP_SESSION_URL__ = !'%VITE_CTP_SESSION_URL%'.startsWith('%') && '%VITE_CTP_SESSION_URL%';
      var __VITE_CTP_CLIENT_ID__ = !'%VITE_CTP_CLIENT_ID%'.startsWith('%') && '%VITE_CTP_CLIENT_ID%';
      var __VITE_CTP_CLIENT_SECRET__ = !'%VITE_CTP_CLIENT_SECRET%'.startsWith('%') && '%VITE_CTP_CLIENT_SECRET%';
      var __VITE_CTP_PROJECT_KEY__ = !'%VITE_CTP_PROJECT_KEY%'.startsWith('%') && '%VITE_CTP_PROJECT_KEY%';
      var __VITE_PROCESSOR_URL__ = !'%VITE_PROCESSOR_URL%'.startsWith('%') && '%VITE_PROCESSOR_URL%';
    </script>
    <script src="../dev-utils/session.js"></script>
  </head>
  <body>
    <main role="main">
      <section class="jumbotron text-center">
        <div class="container">
          <form action="/action_page.php">
            <div class="text-center mb-4">
              <h1 class="h3 mb-3 font-weight-normal">Dev Site</h1>
              <p>Use this site for development purposes</p>
            </div>
          </form>
        </div>
      </section>

      <div class="album py-5 bg-light">
        <div class="container" id="container">
          <!-- Usage: /?cartId=<cart id>[&sessionId=<session id>] renders both payment options, add &step=summary for the summary. -->
          <div class="row">
            <div class="col-md-6 mb-4" id="installment-payment">
              <h2 class="h5">INSTALLMENT_PAYMENT</h2>
              <div id="installment-payment-label"></div>
              <div id="installment-payment-checkout"></div>
            </div>
            <div class="col-md-6 mb-4" id="bill-payment">
              <h2 class="h5">BILL_PAYMENT</h2>
              <div id="bill-payment-label"></div>
              <div id="bill-payment-checkout"></div>
            </div>
          </div>
          <div id="summary"></div>

          <script type="module">
            import { Enabler } from '/src/main.ts';

            const params = new URLSearchParams(window.location.search);
            const cartId = params.get('cartId');

            if (!cartId) {
              throw new Error('Add ?cartId=<cart id> to the URL.');
            }

            // A session copied from a storefront (X-Session-Id header) avoids needing an API client with manage_sessions.
            const sessionId = params.get('sessionId') ?? (await getSessionId(cartId));

            const enabler = new Enabler({
              processorUrl: __VITE_PROCESSOR_URL__,
              sessionId,
            });

            const pageUrl = (step) => {
              const url = new URL(window.location.href);
              url.searchParams.set('step', step);
              return url.toString();
            };

            if (params.get('step') === 'summary') {
              document.querySelector('.row').remove();

              const summaryBuilder = await enabler.createSummaryBuilder();
              const summaryComponent = summaryBuilder.build({
                paymentId: sessionStorage.getItem('easyCreditPaymentId'),
              });

              await summaryComponent.mount('#summary');
            } else {
              const labelBuilder = await enabler.createLabelBuilder();
              const checkoutBuilder = await enabler.createCheckoutBuilder();

              for (const [paymentType, elementId] of [
                ['INSTALLMENT_PAYMENT', 'installment-payment'],
                ['BILL_PAYMENT', 'bill-payment'],
              ]) {
                const checkoutComponent = checkoutBuilder.build({
                  cartId,
                  paymentType,
                  redirectLinks: {
                    urlSuccess: pageUrl('summary'),
                    urlCancellation: pageUrl('cancelled'),
                    urlDenial: pageUrl('denied'),
                  },
                  customerRelationship: {
                    customerStatus: 'NEW_CUSTOMER',
                    numberOfOrders: 0,
                  },
                  onLoading: () => console.log(`[${paymentType}] loading...`),
                  onError: (error) => console.error(`[${paymentType}] failed to checkout`, error),
                  onSuccess: (response) => {
                    console.log(`[${paymentType}] checkout success`, response);
                    sessionStorage.setItem('easyCreditPaymentId', response.paymentId);
                    window.location.replace(response.redirectUrl);
                  },
                });

                const isAvailable = await checkoutComponent.isAvailable();
                console.log(`[${paymentType}] isAvailable`, isAvailable);

                if (!isAvailable) {
                  document.getElementById(elementId).insertAdjacentHTML('beforeend', '<p>Not available</p>');
                  continue;
                }

                labelBuilder.build({ paymentType }).mount(`#${elementId}-label`);
                await checkoutComponent.mount(`#${elementId}-checkout`);
              }
            }
          </script>
        </div>
      </div>
    </main>
  </body>
</html>
